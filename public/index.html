<!DOCTYPE html>
<html lang="es" class="">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tienda Online</title>
  <script>
    (function () {
      const saved = localStorage.getItem("tienda_theme");
      const preferDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      if (saved === "dark" || (!saved && preferDark)) {
        document.documentElement.classList.add("dark");
      }
    })();
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: {
              50: "#eff6ff", 100: "#dbeafe", 200: "#bfdbfe", 300: "#93c5fd",
              400: "#60a5fa", 500: "#3b82f6", 600: "#2563eb", 700: "#1d4ed8",
              800: "#1e40af", 900: "#1e3a8a"
            }
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col">
  <nav id="navbar" class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 sticky top-0 z-50 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-16 items-center">
        <div class="flex items-center gap-3 cursor-pointer" onclick="App.navigate('catalog')">
          <div class="w-9 h-9 bg-primary-600 rounded-lg flex items-center justify-center text-white font-bold text-lg">T</div>
          <span class="font-semibold text-lg text-slate-900 dark:text-white">Tienda Online</span>
        </div>
        <div class="hidden md:flex items-center gap-1" id="nav-links"></div>
        <div class="flex items-center gap-2" id="nav-user"></div>
      </div>
    </div>
  </nav>

  <main id="app" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full"></main>
  <div id="footer"></div>
  <div id="toasts" class="fixed bottom-4 right-4 z-[100] flex flex-col gap-2"></div>
  <div id="modal-root"></div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/views.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
